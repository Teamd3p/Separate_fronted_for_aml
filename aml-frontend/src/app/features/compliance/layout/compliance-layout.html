<div class="admin-layout">
  <!-- Sidebar Navigation -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7V10C2 16 6 20.5 12 22C18 20.5 22 16 22 10V7L12 2Z" stroke="#007AFF" stroke-width="2" fill="none"/>
          </svg>
        </div>
        <span class="logo-text">AML Compliance</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <span class="nav-section-title">COMPLIANCE NAVIGATION</span>
        
        <a [routerLink]="['/compliance/dashboard']" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="2" fill="none"/>
            <rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
          Dashboard
        </a>

        <a [routerLink]="['/compliance/alerts']" class="nav-item" routerLinkActive="active">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M10.29 3.86L1.82 18C1.64486 18.3024 1.55674 18.6453 1.56911 18.9928C1.58148 19.3403 1.694 19.6779 1.89832 19.9669C2.10264 20.2559 2.38432 20.4847 2.70873 20.6295C3.03314 20.7743 3.39001 20.8297 3.74 20.79H20.25C20.6 20.8297 20.9569 20.7743 21.2813 20.6295C21.6057 20.4847 21.8874 20.2559 22.0917 19.9669C22.296 19.6779 22.4085 19.3403 22.4209 18.9928C22.4333 18.6453 22.3451 18.3024 22.17 18L13.71 3.86C13.5317 3.56611 13.2807 3.32312 12.9812 3.15448C12.6817 2.98585 12.3437 2.89725 12 2.89725C11.6563 2.89725 11.3183 2.98585 11.0188 3.15448C10.7193 3.32312 10.4683 3.56611 10.29 3.86V3.86Z" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
          Alert Management
        </a>

        <a [routerLink]="['/compliance/transactions']" class="nav-item" routerLinkActive="active">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="1" y="4" width="22" height="16" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
            <line x1="1" y1="10" x2="23" y2="10" stroke="currentColor" stroke-width="2"/>
          </svg>
          Transactions
        </a>

        <a [routerLink]="['/compliance/sar']" class="nav-item" routerLinkActive="active">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.89 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" fill="none"/>
            <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
          SAR Reports
        </a>

        <a [routerLink]="['/compliance/profile']" class="nav-item" routerLinkActive="active">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
          Profile
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2"/>
          <polyline points="16,17 21,12 16,7" stroke="currentColor" stroke-width="2"/>
          <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2"/>
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main-content">
    <router-outlet></router-outlet>
  </main>
</div>
