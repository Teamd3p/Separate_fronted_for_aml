<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrace - Create Your Account</title>
  
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>FinTrace</span>
      </div>
    </header>

    <main class="main-content">
      <div class="form-container">
        <h1>Create Your Account</h1>
        <p class="subtitle">Join FinTrace to enhance financial security and streamline compliance.</p>

        <form class="signup-form" id="signupForm">
          <section class="form-section">
            <h2>Personal Details</h2>
            
            <div class="form-row">
              <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
              </div>
              <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" placeholder="John" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="middleName">Middle Name</label>
                <input type="text" id="middleName" name="middleName" placeholder="Michael">
              </div>
              <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="dateOfBirth">Date of Birth *</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" placeholder="dd/mm/yyyy" required>
              </div>
              <div class="form-group">
                <label for="nationality">Nationality *</label>
                <input type="text" id="nationality" name="nationality" placeholder="American" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="contactNumber">Contact Number *</label>
                <input type="tel" id="contactNumber" name="contactNumber" placeholder="1234567890" required>
              </div>
              <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <div class="password-hint">
                  Must contain at least 8 characters with uppercase, lowercase, number, and special character
                </div>
              </div>
            </div>
          </section>

          <section class="form-section">
            <h2>Address Details</h2>
            
            <div class="form-row">
              <div class="form-group">
                <label for="streetAddress">Street Address</label>
                <input type="text" id="streetAddress" name="streetAddress" placeholder="123 Main Street">
              </div>
              <div class="form-group">
                <label for="city">City *</label>
                <input type="text" id="city" name="city" placeholder="New York" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="stateProvince">State/Province *</label>
                <input type="text" id="stateProvince" name="stateProvince" placeholder="NY" required>
              </div>
              <div class="form-group">
                <label for="zipCode">PIN/ZIP Code *</label>
                <input type="text" id="zipCode" name="zipCode" placeholder="10001" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="country">Country *</label>
                <select id="country" name="country" required>
                  <option value="">Select country</option>
                  <option value="US">United States</option>
                  <option value="CA">Canada</option>
                  <option value="UK">United Kingdom</option>
                  <option value="AU">Australia</option>
                  <option value="DE">Germany</option>
                  <option value="FR">France</option>
                  <option value="JP">Japan</option>
                  <option value="IN">India</option>
                </select>
              </div>
              <div class="form-group"></div>
            </div>
          </section>

          <div class="terms-section">
            <label class="checkbox-container">
              <input type="checkbox" id="terms" name="terms" required>
              <span class="checkmark"></span>
              I agree to the <a href="#" class="link">Terms of Service</a> and <a href="#" class="link">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="submit-btn">Save Details & Send Verification Code</button>

          <div class="login-link">
            Already have an account? <a href="#" class="link">Log in</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
