<div class="login-container">
    <div class="login-card">
        <header class="login-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L2 7V10C2 16 6 20.5 12 22C18 20.5 22 16 22 10V7L12 2Z" stroke="#007AFF" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <span class="logo-text">FinTrace</span>
            </div>
        </header>

        <div class="login-content">
            <div class="login-title-section">
                <h1 class="login-title">Login to FinTrace</h1>
                <p class="login-subtitle">Enter your credentials to access your account.</p>
            </div>

            <form class="login-form" (ngSubmit)="onLogin()">
                <!-- Error Message -->
                <div *ngIf="errorMessage" class="error-message" style="background: #fee; color: #c53030; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #fecaca;">
                    {{ errorMessage }}
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="#9CA3AF" stroke-width="2" fill="none"/>
                                <polyline points="22,6 12,13 2,6" stroke="#9CA3AF" stroke-width="2" fill="none"/>
                            </svg>
                        </div>
                        <input type="email" id="email" name="email" class="form-input" placeholder="john.doe@example.com" [(ngModel)]="loginData.email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="#9CA3AF" stroke-width="2" fill="none"/>
                                <circle cx="12" cy="7" r="4" stroke="#9CA3AF" stroke-width="2" fill="none"/>
                                <path d="M7 11V7A5 5 0 0 1 17 7V11" stroke="#9CA3AF" stroke-width="2" fill="none"/>
                            </svg>
                        </div>
                        <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" class="form-input" placeholder="••••••••" [(ngModel)]="loginData.password" required>
                        <button type="button" class="password-toggle" (click)="togglePassword()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="eye-icon">
                                <path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z" stroke="#9CA3AF" stroke-width="2" fill="none"/>
                                <circle cx="12" cy="12" r="3" stroke="#9CA3AF" stroke-width="2" fill="none"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe" name="rememberMe" [(ngModel)]="rememberMe">
                        <span class="checkmark"></span>
                        <span class="checkbox-text">Remember me (MFA option)</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <div class="captcha-section">
                    <div class="math-captcha-wrapper">
                        <h3 class="captcha-title">CAPTCHA</h3>
                        <div class="math-question">
                          
                            <div class="math-problem">
                                <span class="math-expression">{{ captchaNum1 }} + {{ captchaNum2 }} =</span>
                                <input 
                                    type="text" 
                                    id="captchaAnswer" 
                                    name="captchaAnswer" 
                                    [(ngModel)]="captchaAnswer" 
                                    class="captcha-input"
                                    placeholder="?"
                                    required
                                    maxlength="3"
                                >
                            </div>
                            <p class="captcha-hint">Solve this math problem and enter the result. E.g. for 1+3, enter 4.</p>
                        </div>
                    </div>
                </div>

                <button type="submit" class="login-btn" [disabled]="isLoading">
                    <span *ngIf="isLoading">Logging in...</span>
                    <span *ngIf="!isLoading">Login</span>
                </button>
            </form>

            <div class="login-footer">
                <p class="register-link">Don't have an account? <a routerLink="/auth/register" class="link">Register</a></p>
            </div>
        </div>
    </div>
</div>
